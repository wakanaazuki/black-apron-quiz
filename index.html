<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ブラックエプロン試験(コーヒーマスター)対策のクイズアプリ(4択・本試験モード対応)">
  <meta name="theme-color" content="#00754a">

  <!-- PWA / モバイル対応 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BEクイズ">

  <title>ブラックエプロン試験クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo-mark">&#9749;</div>
      <div>
        <h1 class="app-title">ブラックエプロン試験クイズ</h1>
        <p class="app-subtitle">Coffee Master Practice</p>
      </div>
      <button class="theme-btn" data-action-global="theme" aria-label="テーマ切替(自動/ライト/ダーク)" title="テーマ切替">◐</button>
    </header>

    <main id="screen" class="screen"><!-- JSで描画 --></main>

    <footer class="app-footer">
      練習問題は一般的な出題範囲に基づくオリジナル問題です(本試験モードの問題は配布資料に基づきます)
    </footer>
  </div>

  <!-- 構造化マスタ(classic script: window.COFFEE_DATA / REFERENCE_DATA / TERMS_DATA) -->
  <script src="data/coffees.js"></script>
  <script src="data/reference.js"></script>
  <script src="data/terms.js"></script>

  <!-- 問題データ(classic script: window.QUESTION_DATA へ push される) -->
  <script src="data/questions/basic.js"></script>
  <script src="data/questions/origin.js"></script>
  <script src="data/questions/process.js"></script>
  <script src="data/questions/brewing.js"></script>
  <script src="data/questions/tasting.js"></script>
  <script src="data/questions/core-coffee.js"></script>
  <script src="data/questions/history.js"></script>
  <!-- 自動生成(構造化マスタから生成) -->
  <script src="data/questions/generated-core.js"></script>
  <script src="data/questions/generated-seasonal.js"></script>
  <script src="data/questions/generated-service.js"></script>
  <script src="data/questions/generated-reference.js"></script>
  <script src="data/questions/generated-terms.js"></script>
  <!-- 手書き追加 -->
  <script src="data/questions/manual-basic.js"></script>
  <script src="data/questions/manual-tasting.js"></script>
  <script src="data/questions/manual-brewing.js"></script>
  <script src="data/questions/manual-process.js"></script>
  <script src="data/questions/manual-history.js"></script>

  <!-- 本試験モード用 問題バンク(window.MOCK_BANK) -->
  <script src="data/mock/bank.js"></script>

  <script src="core.js"></script>
  <script src="app.js"></script>
  <script>
    // オフライン対応・ホーム画面追加(PWA)のためのService Worker登録
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
      // 新しいSWに切り替わったら自動リロード(古いキャッシュが残るのを防ぐ)
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
